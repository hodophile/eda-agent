[project]
name = "eda-agent"
version = "0.1.0"
description = "Phase 1: single-agent event-driven ReAct loop over Kafka + Redis."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiokafka>=0.11",
    "redis[hiredis]>=5.0",
    "openai>=1.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "orchestrator", "llm_service", "tool_service", "test_client"]
