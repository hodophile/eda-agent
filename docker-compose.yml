# Phase 1 backbone: KRaft Kafka + Redis + Ollama.
# Phase 2 stores (MongoDB, Qdrant) are behind the "phase2" profile and are NOT
# required to run Phase 1.
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: eda-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node (broker + controller). Apache Kafka 4.x is KRaft only.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # INTERNAL = for other containers (advertised as the service name);
      # EXTERNAL = for host-side clients like our Python services.
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Valid base64-encoded UUID (from the apache/kafka docs example).
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Topics are created explicitly by kafka-init for reproducibility.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-node: internal topics must replicate to 1 broker, not the default 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/tmp/kraft-log
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # One-shot: creates the agent.* topics with 3 partitions each.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: eda-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in agent.tasks.in agent.llm.requests agent.llm.responses \
                 agent.tool.requests agent.tool.responses agent.lifecycle.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
          echo "topic ready: $$t"
        done
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: eda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: eda-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # NOTE: for GPU acceleration uncomment the deploy block below and ensure
    # the NVIDIA Container Toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # One-shot: pulls the model used by the LLM service.
  ollama-init:
    image: ollama/ollama:latest
    container_name: eda-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama3}"]
    restart: "no"

  # ---- Phase 2 (optional) -------------------------------------------------
  mongodb:
    profiles: ["phase2"]
    image: mongo:7
    container_name: eda-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    profiles: ["phase2"]
    image: qdrant/qdrant:latest
    container_name: eda-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  kafka-data:
  redis-data:
  ollama-data:
  mongo-data:
  qdrant-data:
